<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse the maintained BARE ICON3 BONES glyph catalog.">
  <title>BARE ICON3 — BONES catalog</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0a0a; --panel:#101719; --line:#1d2a2d; --ink:#e6f7fa; --dim:#91a9ad; --cyan:#00e5ff; --yellow:#ffe600; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
    header, main, footer { width:min(100% - 32px, 1080px); margin:auto; }
    header { padding:28px 0 20px; border-bottom:1px solid var(--line); }
    .eyebrow { color:var(--yellow); font-size:.75rem; letter-spacing:.16em; }
    h1 { margin:.4rem 0; font-size:clamp(1.5rem,5vw,2.4rem); }
    header p, footer { color:var(--dim); }
    main { padding:24px 0 40px; }
    .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
    input { flex:1 1 220px; min-height:44px; padding:10px 12px; color:var(--ink); background:var(--panel); border:1px solid var(--line); font:inherit; }
    #count { color:var(--cyan); font-size:.85rem; }
    #status { min-height:1.5em; color:var(--dim); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr)); gap:10px; }
    .card { min-width:0; padding:16px; border:1px solid var(--line); background:var(--panel); }
    .glyph { display:grid; place-items:center; min-height:92px; color:var(--cyan); font-size:3rem; }
    .name { margin:8px 0 2px; color:var(--ink); font-size:1rem; }
    .id { color:var(--yellow); font-size:.75rem; }
    .spec { margin-top:10px; color:var(--dim); font-size:.78rem; overflow-wrap:anywhere; }
    footer { padding:16px 0 28px; border-top:1px solid var(--line); font-size:.75rem; }
    a { color:var(--cyan); }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">BARE ICON3 / <span id="pack">BONES</span></div>
    <h1 id="title">Glyph catalog</h1>
    <p id="tagline">Browse maintained catalog entries.</p>
    <a href="./">← Back to the icon browser</a>
  </header>
  <main>
    <div class="toolbar">
      <label for="search">Filter icons</label>
      <input id="search" type="search" placeholder="Search name, ID, glyph, or spec" autocomplete="off">
      <output id="count" aria-live="polite"></output>
    </div>
    <p id="status" role="status" aria-live="polite">Loading catalog…</p>
    <section id="grid" class="grid" aria-label="Catalog icons"></section>
  </main>
  <footer id="credit">Maintained by BareBones Projects.</footer>
  <script>
    const grid = document.querySelector('#grid');
    const search = document.querySelector('#search');
    const status = document.querySelector('#status');
    const count = document.querySelector('#count');
    let icons = [];
    function render() {
      const q = search.value.trim().toLocaleLowerCase();
      const shown = icons.filter(icon => [icon.id, icon.name, icon.glyph, icon.spec].some(value => String(value ?? '').toLocaleLowerCase().includes(q)));
      grid.replaceChildren(...shown.map(icon => {
        const card = document.createElement('article'); card.className = 'card';
        const glyph = document.createElement('div'); glyph.className = 'glyph'; glyph.textContent = icon.glyph ?? ''; glyph.setAttribute('aria-label', `Glyph ${icon.glyph ?? ''}`);
        const id = document.createElement('div'); id.className = 'id'; id.textContent = icon.id ?? 'NO ID';
        const name = document.createElement('h2'); name.className = 'name'; name.textContent = icon.name ?? 'Unnamed icon';
        const spec = document.createElement('div'); spec.className = 'spec'; spec.textContent = icon.spec ?? '';
        card.append(glyph, id, name, spec); return card;
      }));
      count.textContent = `${shown.length} / ${icons.length} icons`;
      status.textContent = shown.length ? '' : 'No icons match your search.';
    }
    search.addEventListener('input', render);
    fetch('./content.json').then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); }).then(data => {
      if (!Array.isArray(data.icons)) throw new Error('Catalog is missing its icons array.');
      icons = data.icons;
      document.title = `${data.title || data.codename || 'BARE ICON3'} — catalog`;
      document.querySelector('#title').textContent = data.title || 'Glyph catalog';
      document.querySelector('#pack').textContent = data.pack || data.codename || 'CATALOG';
      document.querySelector('#tagline').textContent = data.tagline || data.description || 'Browse maintained catalog entries.';
      document.querySelector('#credit').textContent = `Version ${data.version || '—'} · Maintained by ${data.creator || 'BareBones Projects'}.`;
      render();
    }).catch(error => { status.textContent = `Could not load content.json: ${error.message} Start the local server with ./serve.sh.`; count.textContent = ''; });
  </script>
</body>
</html>
